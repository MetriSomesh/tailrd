[project]
name = "tailrd-api"
version = "0.1.0"
description = "Tailrd API — AI resume tailoring as a service"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "migrations/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no stray prints)
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "T20", "ASYNC240"]
"app/engine/*" = ["T20", "S110", "S105", "E501", "C4", "UP", "B", "SIM", "RET", "I"]  # ported code, lint lightly
"app/services/email.py" = ["T20"]  # console provider prints emails intentionally
"tests/engine/*" = ["S101", "S105", "S106", "T20", "ASYNC240", "E501", "I", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["\\.venv", "migrations"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "slowapi.*", "authlib.*", "docx.*"]
ignore_missing_imports = true
